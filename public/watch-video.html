<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extracted Wedding Video Player</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #E9D08B;
    }
    video {
      width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #000;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-block;
      padding: 10px 20px;
      background: #c79a3b;
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    a.btn.secondary {
      background: #333;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Extracted Wedding Video</h1>
    <video controls autoplay playsinline loop>
      <source src="extracted_video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="actions">
      <a class="btn" href="extracted_video.mp4" download="extracted_wedding_video.mp4">⬇️ Download Video</a>
      <a class="btn secondary" href="index.html">👰 Go to Wedding Website</a>
    </div>
  </div>
</body>
</html>
